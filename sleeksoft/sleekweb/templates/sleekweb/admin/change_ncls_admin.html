{% extends './base.html' %}
{% block title %}Trang Nghiên cứu lâm sàng (ảnh){% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-images"></i></div>
            <div>
                <h1 class="ap-title">Ảnh nghiên cứu lâm sàng</h1>
                <div class="ap-title-sub">Cập nhật 2 hình ảnh hiển thị trên trang NCLS</div>
            </div>
        </div>
    </div>

    <div class="ap-card">
        <form method="post" action="{% url 'change_ncls_admin' %}" enctype="multipart/form-data" class="ap-form-wide">
            {% csrf_token %}
            <div class="ap-field-row">
                <div class="ap-field">
                    <label>1. Hình ảnh NCKH</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 1" src="{% if obj.Nckh %}{{obj.Nckh.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Nckh" />
                    </div>
                </div>
                <div class="ap-field">
                    <label>2. Hình ảnh KQLS</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 2" src="{% if obj.Kqls %}{{obj.Kqls.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Kqls" />
                    </div>
                </div>
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success">
                    <i class="fas fa-floppy-disk"></i>Cập nhật
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
