{% extends './base.html' %}
{% block title %}Trang Kết quả lâm sàng{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-notes-medical"></i></div>
            <div>
                <h1 class="ap-title">Kết quả lâm sàng</h1>
                <div class="ap-title-sub">Cấu hình banner & tiêu đề trang KQLS</div>
            </div>
        </div>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-image"></i>Banner 1 & tiêu đề 1 & nội dung 1</div>
        <form method="post" action="{% url 'change_kqls_admin' %}" enctype="multipart/form-data" class="ap-form-wide">
            {% csrf_token %}
            <div class="ap-field">
                <label>Hình ảnh 1</label>
                <div class="ap-image-preview">
                    <img alt="Hình ảnh 1" src="{% if obj.Photo1 %}{{obj.Photo1.url}}{% endif %}" />
                    <input type="file" accept="image/*" name="Photo1" />
                </div>
            </div>
            <div class="ap-field">
                <label>Tiêu đề 1</label>
                <input type="text" value="{{obj.Title1}}" name="Title1" placeholder="Tiêu đề 1" />
            </div>
            <div class="ap-field">
                <label>Nội dung 1</label>
                <textarea placeholder="Nội dung 1" name="Content1" style="min-height:150px">{{obj.Content1}}</textarea>
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success">
                    <i class="fas fa-floppy-disk"></i>Cập nhật
                </button>
            </div>
        </form>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-align-left"></i>Tiêu đề 2 & nội dung 2</div>
        <form method="post" action="{% url 'change_kqls_admin' %}" enctype="multipart/form-data" class="ap-form-wide">
            {% csrf_token %}
            <div class="ap-field">
                <label>Tiêu đề 2</label>
                <input type="text" value="{{obj.Title2}}" name="Title2" placeholder="Tiêu đề 2" />
            </div>
            <div class="ap-field">
                <label>Nội dung 2</label>
                <textarea placeholder="Nội dung 2" name="Content2" style="min-height:150px">{{obj.Content2}}</textarea>
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success">
                    <i class="fas fa-floppy-disk"></i>Cập nhật
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
