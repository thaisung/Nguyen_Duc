{% extends './base.html' %}
{% block title %}Thêm Sản phẩm{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-plus"></i></div>
            <div>
                <h1 class="ap-title">Thêm sản phẩm</h1>
                <div class="ap-title-sub">Tạo sản phẩm mới kèm ảnh & NCLS</div>
            </div>
        </div>
    </div>

    <form method="POST" class="blog-form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div>
            <label>Ảnh sản phẩm</label>
            <input type="file" multiple accept="image/*" name="List_Photo" required />
        </div>
        <div style="margin-top:14px;">
            <label>Ảnh NCLS</label>
            <input type="file" multiple accept="image/*" name="List_Photo_NCLS" required />
        </div>
        <div class="ap-form-actions" style="margin-top:18px;">
            <button type="submit" class="ap-btn ap-btn-success">
                <i class="fas fa-plus"></i>Thêm sản phẩm
            </button>
        </div>
    </form>
</div>

<script>
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('textarea.autoresize').forEach(function (el) {
            autoResize(el);
            el.addEventListener('input', () => autoResize(el));
        });
    });
</script>
{% endblock %}
