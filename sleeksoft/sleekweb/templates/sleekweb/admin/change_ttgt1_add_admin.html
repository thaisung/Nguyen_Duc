{% extends './base.html' %}
{% block title %}Thêm bài Tin tức & Giải thưởng{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-plus"></i></div>
            <div>
                <h1 class="ap-title">Thêm bài Tin tức & Giải thưởng</h1>
                <div class="ap-title-sub">Tạo bài viết mới</div>
            </div>
        </div>
    </div>

    <form method="POST" class="blog-form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="ap-form-actions">
            <button type="submit" class="ap-btn ap-btn-success">
                <i class="fas fa-plus"></i>Thêm bài
            </button>
        </div>
    </form>
</div>

<script>
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('textarea.autoresize').forEach(function (el) {
            autoResize(el);
            el.addEventListener('input', () => autoResize(el));
        });
    });
</script>
{% endblock %}
