{% extends './base.html' %}
{% block title %}Nội dung Blog{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-images"></i></div>
            <div>
                <h1 class="ap-title">Nội dung Blog</h1>
                <div class="ap-title-sub">Hình ảnh & nội dung các trang Blog con</div>
            </div>
        </div>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-file-lines"></i>1. Trang Blog 1</div>
        <form method="post" action="{% url 'image_content_admin' %}" enctype="multipart/form-data" class="ap-form-wide">
            {% csrf_token %}
            <input type="hidden" name="Count" value="3" />
            <div class="ap-field-row">
                <div class="ap-field">
                    <label>Hình ảnh 1 & nội dung 1</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 1" src="{% if obj_Count_3.Photo1 %}{{obj_Count_3.Photo1.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Photo7" />
                    </div>
                    <textarea name="Content7" class="autoresize" placeholder="Nội dung 1" style="margin-top:8px;">{{obj_Count_3.Content1|default:''}}</textarea>
                </div>
                <div class="ap-field">
                    <label>Hình ảnh 2 & nội dung 2</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 2" src="{% if obj_Count_3.Photo2 %}{{obj_Count_3.Photo2.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Photo8" />
                    </div>
                    <textarea name="Content8" class="autoresize" placeholder="Nội dung 2" style="margin-top:8px;">{{obj_Count_3.Content2|default:''}}</textarea>
                </div>
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success"><i class="fas fa-floppy-disk"></i>Cập nhật</button>
            </div>
        </form>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-file-lines"></i>2. Trang Blog 2</div>
        <form method="post" action="{% url 'image_content_admin' %}" enctype="multipart/form-data" class="ap-form-wide">
            {% csrf_token %}
            <input type="hidden" name="Count" value="4" />
            <div class="ap-field-row">
                <div class="ap-field">
                    <label>Hình ảnh 1 & nội dung 1</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 1" src="{% if obj_Count_4.Photo1 %}{{obj_Count_4.Photo1.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Photo9" />
                    </div>
                    <textarea name="Content9" class="autoresize" placeholder="Nội dung 1" style="margin-top:8px;">{{obj_Count_4.Content1|default:''}}</textarea>
                </div>
                <div class="ap-field">
                    <label>Hình ảnh 2</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 2" src="{% if obj_Count_4.Photo2 %}{{obj_Count_4.Photo2.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Photo10" />
                    </div>
                </div>
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success"><i class="fas fa-floppy-disk"></i>Cập nhật</button>
            </div>
        </form>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-file-lines"></i>3. Trang Blog 3</div>
        <form method="post" action="{% url 'image_content_admin' %}" enctype="multipart/form-data" class="ap-form-wide">
            {% csrf_token %}
            <input type="hidden" name="Count" value="5" />
            <div class="ap-field-row">
                <div class="ap-field">
                    <label>Hình ảnh 1 & nội dung 1</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 1" src="{% if obj_Count_5.Photo1 %}{{obj_Count_5.Photo1.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Photo11" />
                    </div>
                    <textarea name="Content11" class="autoresize" placeholder="Nội dung 1" style="margin-top:8px;">{{obj_Count_5.Content1|default:''}}</textarea>
                </div>
                <div class="ap-field">
                    <label>Hình ảnh 2</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 2" src="{% if obj_Count_5.Photo2 %}{{obj_Count_5.Photo2.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Photo12" />
                    </div>
                </div>
                <div class="ap-field">
                    <label>Hình ảnh 3</label>
                    <div class="ap-image-preview">
                        <img alt="Hình ảnh 3" src="{% if obj_Count_5.Photo3 %}{{obj_Count_5.Photo3.url}}{% endif %}" />
                        <input type="file" accept="image/*" name="Photo13" />
                    </div>
                </div>
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success"><i class="fas fa-floppy-disk"></i>Cập nhật</button>
            </div>
        </form>
    </div>
</div>

<script>
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('textarea.autoresize').forEach(function (el) {
            autoResize(el);
            el.addEventListener('input', () => autoResize(el));
        });
    });
</script>
{% endblock %}
