{% extends './base.html' %}
{% block title %}Quản lý Blog{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-pen-to-square"></i></div>
            <div>
                <h1 class="ap-title">Quản lý Blog</h1>
                <div class="ap-title-sub">Danh sách bài viết Blog</div>
            </div>
        </div>
        <div class="ap-head-actions">
            <form class="ap-search">
                <input value="{{s}}" name="s" placeholder="Tìm kiếm..." />
                <button type="submit"><i class="fas fa-magnifying-glass"></i></button>
            </form>
            <a href="{% url 'change_blog_add_admin' %}" class="ap-btn ap-btn-primary">
                <i class="fas fa-plus"></i>Thêm mới
            </a>
        </div>
    </div>

    <div class="ap-seo">
        <div class="ap-seo-head"><i class="fas fa-magnifying-glass"></i>Cấu hình SEO</div>
        <form method="post" action="{% url 'change_seo_page_admin' %}">
            {% csrf_token %}
            <input type="hidden" name="Name_Page" value="BL"/>
            <div class="ap-seo-row">
                <span class="ap-seo-label">Seo Title</span>
                <input type="text" name="Seo_Title" value="{{ obj_Seo_Page.Seo_Title }}" onchange="this.form.submit()">
            </div>
            <div class="ap-seo-row">
                <span class="ap-seo-label">Seo Description</span>
                <input type="text" name="Seo_Description" value="{{ obj_Seo_Page.Seo_Description }}" onchange="this.form.submit()">
            </div>
        </form>
    </div>

    <div class="ap-grid ap-grid-3">
        {% for i in list_BlogPost %}
        <div class="ap-item">
            <div class="ap-item-img">
                <img src="{% if i.Avatar %}{{ i.Avatar.url }}{% endif %}" alt="{{i.Title}}" />
            </div>
            <div class="ap-item-body">
                <div class="ap-item-title">{{i.Title}}</div>
            </div>
            <div class="ap-item-actions">
                <a href="{% url 'change_blog_edit_admin' pk=i.pk %}" class="ap-btn ap-btn-sm ap-btn-success">
                    <i class="fas fa-pen"></i>Chỉnh sửa
                </a>
                <a href="{% url 'slug_router' slug=i.Slug %}" target="_blank" class="ap-btn ap-btn-sm ap-btn-info">
                    <i class="fas fa-eye"></i>Xem
                </a>
                <form method="post" action="{% url 'change_blog_remove_admin' pk=i.pk %}" onsubmit="return confirm('Bạn có chắc muốn xoá bài viết này?');" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="ap-btn ap-btn-sm ap-btn-danger">
                        <i class="fas fa-trash"></i>Xoá
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="pagination {% if list_BlogPost.paginator.num_pages <= 1 %}hidden{% endif %}">
        <ul></ul>
    </div>
</div>

<script>
    const element = document.querySelector(".pagination ul");
    let totalPages = {{list_BlogPost.paginator.num_pages}};
    let page = {{list_BlogPost.number}};
    let s = "{{ s|default:'' }}";

    function createPagination(totalPages, page) {
        let liTag = '';
        let active;
        let beforePage = page - 1;
        let afterPage = page + 1;
        const arrowLeft = `<i class="fas fa-chevron-left"></i>`;
        const arrowRight = `<i class="fas fa-chevron-right"></i>`;

        if (page > 1) {
            liTag += `<a href="?p=${page - 1}&s=${s}" class="btn prev">${arrowLeft}</a>`;
        }
        if (totalPages < 8) {
            for (let i = 1; i <= totalPages; i++) {
                active = (page == i) ? "active" : "";
                liTag += `<a href="?p=${i}&s=${s}" class="numb ${active}">${i}</a>`;
            }
        } else {
            if (page > 2) {
                liTag += `<a href="?p=1&s=${s}" class="first numb">1</a>`;
                if (page > 3) liTag += `<a class="dots">...</a>`;
            }
            if (page == totalPages) beforePage -= 2;
            else if (page == totalPages - 1) beforePage -= 1;
            if (page == 1) afterPage += 2;
            else if (page == 2) afterPage += 1;
            for (let plength = beforePage; plength <= afterPage; plength++) {
                if (plength > totalPages) continue;
                if (plength == 0) plength = 1;
                active = (page == plength) ? "active" : "";
                liTag += `<a href="?p=${plength}&s=${s}" class="numb ${active}">${plength}</a>`;
            }
            if (page < totalPages - 1) {
                if (page < totalPages - 2) liTag += `<a class="dots">...</a>`;
                liTag += `<a href="?p=${totalPages}&s=${s}" class="last numb">${totalPages}</a>`;
            }
        }
        if (page < totalPages) {
            liTag += `<a href="?p=${page + 1}&s=${s}" class="btn next">${arrowRight}</a>`;
        }
        element.innerHTML = liTag;
        return liTag;
    }
    element.innerHTML = createPagination(totalPages, page);
</script>
{% endblock %}
