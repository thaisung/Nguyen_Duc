{% extends './base.html' %}
{% block title %}Tài khoản{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-user-gear"></i></div>
            <div>
                <h1 class="ap-title">Thông tin tài khoản</h1>
                <div class="ap-title-sub">Quản lý tài khoản quản trị</div>
            </div>
        </div>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-circle-user"></i>Thông tin</div>
        <div style="display:flex; flex-direction:column; gap:8px; font-size:14px; color:var(--admin-text);">
            <div><strong>Tên tài khoản:</strong> {{obj_user.username}}</div>
            <div><strong>Ngày tạo:</strong> {{obj_user.Creation_time|date:'d/m/Y'}}</div>
        </div>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-key"></i>Đổi mật khẩu</div>
        <form id="change_password" class="ap-form-single">
            {% csrf_token %}
            <input type="hidden" value="{{obj_user.id}}" name="id"/>
            <div class="ap-field">
                <label>Mật khẩu mới</label>
                <input type="password" name="new_password" placeholder="Nhập mật khẩu mới" />
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success">
                    <i class="fas fa-check"></i>Đổi mật khẩu
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#change_password').on('submit', function(event) {
            event.preventDefault();
            var formData = new FormData(this);
            $.ajax({
                url: '{% url 'user_change_password_admin' %}',
                method: 'POST',
                processData: false,
                contentType: false,
                data: formData,
                success: function(response) {
                    if (response.success) {
                        alert(response.message);
                        window.location.reload();
                    } else {
                        alert(response.message);
                    }
                },
                error: function(response) {
                    alert(response.message);
                }
            });
        });
    });
</script>
{% endblock %}
