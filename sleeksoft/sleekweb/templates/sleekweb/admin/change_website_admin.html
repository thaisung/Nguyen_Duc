{% extends './base.html' %}
{% block title %}Thông tin Website{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-globe"></i></div>
            <div>
                <h1 class="ap-title">Thông tin Website</h1>
                <div class="ap-title-sub">Cấu hình thông tin chung của website</div>
            </div>
        </div>
    </div>

    <div class="ap-card">
        <form method="post" action="{% url 'change_website_admin' %}" enctype="multipart/form-data" class="ap-form-single">
            {% csrf_token %}
            <div class="ap-field">
                <label>Email</label>
                <input type="text" value="{{obj.Email}}" name="Email" required />
            </div>
            <div class="ap-field">
                <label>Số điện thoại</label>
                <input type="text" value="{{obj.Phone_number}}" name="Phone_number" required />
            </div>
            <div class="ap-field">
                <label>Chữ chạy</label>
                <input type="text" value="{{obj.Text_run}}" name="Text_run" required />
            </div>
            <div class="ap-field">
                <label>Logo</label>
                <div class="ap-image-preview" style="background:linear-gradient(135deg,#11284A 0%,#0e203c 100%); border-color:rgba(201,168,106,.35);">
                    <img src="{% if obj.Logo %}{{ obj.Logo.url }}{% endif %}" style="max-height:140px; background:transparent;" />
                    <input type="file" accept="image/*" name="Logo" style="background:#fff;" />
                </div>
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success">
                    <i class="fas fa-floppy-disk"></i>Cập nhật
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
