{% extends './base.html' %}
{% block title %}Trang thay đổi Liên hệ{% endblock %}
{% block content %}
<div class="ap-page">
    <div class="ap-head">
        <div class="ap-head-main">
            <div class="ap-head-icon"><i class="fas fa-envelope"></i></div>
            <div>
                <h1 class="ap-title">Liên hệ</h1>
                <div class="ap-title-sub">Cập nhật thông tin liên hệ của website</div>
            </div>
        </div>
    </div>

    <div class="ap-seo">
        <div class="ap-seo-head"><i class="fas fa-magnifying-glass"></i>Cấu hình SEO</div>
        <form method="post" action="{% url 'change_seo_page_admin' %}">
            {% csrf_token %}
            <input type="hidden" name="Name_Page" value="LH"/>
            <div class="ap-seo-row">
                <span class="ap-seo-label">Seo Title</span>
                <input type="text" name="Seo_Title" value="{{ obj_Seo_Page.Seo_Title }}" onchange="this.form.submit()">
            </div>
            <div class="ap-seo-row">
                <span class="ap-seo-label">Seo Description</span>
                <input type="text" name="Seo_Description" value="{{ obj_Seo_Page.Seo_Description }}" onchange="this.form.submit()">
            </div>
        </form>
    </div>

    <div class="ap-card">
        <div class="ap-section-title"><i class="fas fa-location-dot"></i>Thông tin địa chỉ</div>
        <form method="post" action="{% url 'change_lh_admin' %}" enctype="multipart/form-data" class="ap-form-single">
            {% csrf_token %}
            <div class="ap-field">
                <label>Địa chỉ</label>
                <input type="text" value="{{obj.Address}}" placeholder="Nhập địa chỉ" name="Address" />
            </div>
            <div class="ap-field">
                <label>Link Google Map</label>
                <input type="text" value="{{obj.Link_map}}" placeholder="Dán link nhúng Google Map" name="Link_map" />
            </div>
            <div class="ap-form-actions">
                <button type="submit" class="ap-btn ap-btn-success">
                    <i class="fas fa-floppy-disk"></i>Cập nhật
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
