<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>410 — Trang đã bị xóa vĩnh viễn</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1e1510;
      --bg-deep: #150f0a;
      --surface: #2c1e14;
      --border:  rgba(255,255,255,0.07);
      --accent:  #f78e5e;
      --accent2: #f0c96b;
      --text:    #f5e8dc;
      --muted:   #7a5a42;
      --glow:    rgba(247,142,94,0.15);
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

    /* Noise */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 100; opacity: 0.7;
    }

    /* Subtle grid */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 72px 72px;
      pointer-events: none; z-index: 0;
    }

    /* Orbs */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); pointer-events: none;
      animation: drift 9s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(247,142,94,0.09), transparent 70%);
      top: -180px; right: -120px; animation-delay: 0s;
    }
    .orb-2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(200,60,20,0.07), transparent 70%);
      bottom: -120px; left: -100px; animation-delay: -4s;
    }
    .orb-3 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(240,201,107,0.05), transparent 70%);
      top: 20%; right: 10%; animation-delay: -2.5s;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(20px,15px) scale(1.06); }
    }

    /* Horizontal rule top — ember/warning tone */
    .hr-top {
      position: fixed; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2), var(--accent), transparent);
      z-index: 10;
    }

    .scene {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }

    /* Tag */
    .tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid rgba(247,142,94,0.22);
      color: var(--accent);
      font-size: 10.5px; font-weight: 400;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 7px 18px; border-radius: 100px;
      margin-bottom: 1.6rem;
      animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) 0.3s both;
    }
    /* Solid dot — gone, no pulse */
    .tag::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      opacity: 0.45;
    }

    /* 410 */
    .four-ten {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(130px, 21vw, 270px);
      line-height: 0.85;
      letter-spacing: -0.01em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--muted);
      position: relative;
      user-select: none;
      animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) both;
    }

    /* Accent fill slice — ember orange instead of blue */
    .four-ten::after {
      content: '410';
      position: absolute; inset: 0;
      color: var(--accent);
      -webkit-text-stroke: 0;
      clip-path: polygon(0 60%, 100% 54%, 100% 100%, 0 100%);
      animation: revealSlice 1.1s cubic-bezier(.16,1,.3,1) 0.15s both;
    }

    /* Warm gold ghost shadow */
    .four-ten::before {
      content: '410';
      position: absolute; inset: 0;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(240,201,107,0.14);
      transform: translate(3px, 4px);
      z-index: -1;
    }

    /* Strikethrough line — "gone" visual metaphor */
    .strike-wrap {
      position: relative;
      display: inline-block;
      animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) both;
    }
    .strike-wrap::after {
      content: '';
      position: absolute;
      left: -4%; right: -4%;
      top: 50%; height: 2.5px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transform: translateY(-50%) rotate(-1.8deg);
      animation: strikeIn 0.8s cubic-bezier(.16,1,.3,1) 0.9s both;
      transform-origin: left center;
    }
    @keyframes strikeIn {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(36px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes revealSlice {
      from { clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); }
      to   { clip-path: polygon(0 60%, 100% 54%, 100% 100%, 0 100%); }
    }

    h1 {
      font-size: clamp(1rem, 2.4vw, 1.45rem);
      font-weight: 300; letter-spacing: 0.01em;
      color: var(--text); max-width: 440px; line-height: 1.55;
      margin-bottom: 0.5rem;
      animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) 0.55s both;
    }
    h1 em { font-style: italic; color: var(--accent2); }

    .sub {
      font-size: 0.87rem; color: var(--muted); font-weight: 300;
      margin-bottom: 2.8rem;
      animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) 0.65s both;
    }

    /* Buttons */
    .actions {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) 0.8s both;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 26px; border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 400;
      cursor: pointer; text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      letter-spacing: 0.02em;
    }
    .btn-primary {
      background: var(--accent); color: #150f0a; border: none;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px var(--glow), 0 4px 20px rgba(247,142,94,0.25);
    }
    .btn-ghost {
      background: transparent; color: var(--text);
      border: 1px solid var(--muted);
    }
    .btn-ghost:hover {
      border-color: var(--accent); color: var(--accent);
      transform: translateY(-2px);
    }

    /* Bottom info */
    .line {
      width: 1px; height: 52px;
      background: linear-gradient(to bottom, transparent, var(--muted), transparent);
      margin: 3rem auto 1rem;
      animation: fadeUp 0.7s 1s both;
    }
    .hint {
      font-size: 0.76rem; color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase;
      animation: fadeUp 0.7s 1.05s both;
    }

    /* Corner coords */
    .corner {
      position: fixed; font-size: 0.65rem; color: var(--muted);
      letter-spacing: 0.1em; font-family: monospace;
      opacity: 0.5;
    }
    .corner-tl { top: 20px; left: 24px; }
    .corner-tr { top: 20px; right: 24px; text-align: right; }
    .corner-bl { bottom: 20px; left: 24px; }
    .corner-br { bottom: 20px; right: 24px; text-align: right; }
  </style>
</head>
<body>

  <div class="hr-top"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="corner corner-tl">SYS // 410</div>
  <div class="corner corner-tr">ERR_GONE</div>
  <div class="corner corner-bl">LAT 21.02 // LNG 105.83</div>
  <div class="corner corner-br">VER 2.4.1</div>

  <div class="scene">
    <div class="tag">Đã xóa vĩnh viễn</div>

    <div class="strike-wrap">
      <div class="four-ten">410</div>
    </div>

    <h1>Trang này đã <em>biến mất vĩnh viễn</em></h1>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Trang chủ
      </a>
      <a href="javascript:history.back()" class="btn btn-ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Quay lại
      </a>
    </div>

    <div class="line"></div>
    <p class="hint">HTTP &nbsp;·&nbsp; 410 Gone</p>
  </div>

</body>
</html>
